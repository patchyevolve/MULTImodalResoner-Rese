[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlforge"
version = "0.1.0"
description = "MLForge — a hardware-agnostic, project-agnostic ML training system"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

# Zero runtime dependencies by design: the core (identity, lifecycle,
# validation, checkpoints) is stdlib-only so the system is portable
# across heterogeneous lab machines (12_training_system.md §6.5).
dependencies = []

[project.scripts]
mlforge = "mlforge.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
